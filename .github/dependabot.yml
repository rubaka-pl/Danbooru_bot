# Автоматические обновления зависимостей: Dependabot раз в месяц открывает PR,
# CI прогоняет тесты — остаётся только нажать Merge, если всё зелёное.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
