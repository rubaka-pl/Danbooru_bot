# Раз в неделю проверяет, что API Danbooru не изменился.
# Если что-то сломалось — GitHub пришлёт письмо, а при заданных секретах
# TELEGRAM_BOT_TOKEN и TELEGRAM_ADMIN_ID ещё и сообщение в Telegram.
name: Danbooru API check

on:
  schedule:
    - cron: '17 9 * * 1' # по понедельникам
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:danbooru
      - name: Уведомить в Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
            curl -s "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=🚨 Проверка API Danbooru не прошла — бот может работать неправильно. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
